name: Deploy Trigger.dev tasks

# Deploying the tasks is not optional and not occasional: `npx trigger.dev deploy`
# uploads a *version* of the code in src/trigger/, and production keeps running
# whatever was uploaded last. Forget it after changing a task and an upload is
# processed by stale code while the form still looks like it worked.
#
# So it runs on every push to main rather than on a paths filter. A task bundles
# far more than src/trigger/ — ingest.ts, lib/pdf, lib/text, the R2 client — and
# a filter that misses one of those transitive files fails silently, in the worst
# possible way: no error, just an old worker. A redundant deploy costs a minute.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy tasks
        # The CLI is a locked devDependency, installed above by
        # --frozen-lockfile, so it is always exactly the version of
        # @trigger.dev/sdk and @trigger.dev/build beside it.
        #
        # This used to be `pnpm dlx trigger.dev@latest`, which resolved the CLI
        # from the network on every run. After the SDK moved to 4.6.2, dlx still
        # handed back 4.6.1 — and the CLI refuses to deploy against packages
        # newer than itself, so the first deploy after merging failed. Pinning a
        # version string here would only drift again at the next bump; the
        # lockfile moves all three together.
        #
        # The package is `trigger.dev` but the binary it installs is `trigger`.
        # `pnpm exec trigger.dev` finds nothing and fails before deploying —
        # caught by running it, not by reading it.
        run: pnpm exec trigger deploy
        env:
          # A personal access token from the Trigger.dev dashboard, stored as a
          # repository secret. Not TRIGGER_SECRET_KEY — that one is for the app
          # triggering runs, and it cannot deploy.
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

          # Which project to deploy to. trigger.config.ts reads it from the
          # environment, and without it falls back to a placeholder — so the
          # first run asked for a project literally called
          # "proj_set_TRIGGER_PROJECT_REF" and failed with "Project not found".
          #
          # Not a secret: it appears in every dashboard and deployment URL. A
          # repository *variable* overrides it if the project ever moves; the
          # literal means the workflow works with no extra setup today.
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF || 'proj_pegxizetjeagfcoeijrb' }}
